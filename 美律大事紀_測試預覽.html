<script type="text/javascript">
  var timelineData = {"events": [{"start_date": {"year": "1975", "month": "12", "day": "24"}, "display_date": "1975/12/24", "text": {"headline": "廖祿立先生與魏文傑先生<br>創立「美律電子股份有限公司」", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53814669073_b7d75252b2_k.jpg"}}, {"start_date": {"year": "1976"}, "text": {"headline": "重視品質<br>大手筆投資購買<br>測試用儀器", "text": "公司執照下來後，開出第一張LC(信用狀)就是買這台音頻分析儀，副董魏文傑說，那時，全國只有六台。\n公司初始資本額一百五十萬元，就花了一百萬元在它身上。"}, "media": {"url": "https://live.staticflickr.com/65535/53695503180_e3f878bb90_n.jpg", "caption": "B&K1023音頻分析儀"}}, {"start_date": {"year": "1976", "month": "7"}, "text": {"headline": "全世界<br>每五支無線電對講機<br>\n就有一支來自美律", "text": "一九七六年七月，美律的第一個產品試製完成，並且在當年十月開始小量生產，這個產品是「CB Radio專用無線電對講機麥克風(microphone for CBRadio)」。"}, "media": {"url": "https://live.staticflickr.com/65535/53799320073_f7b90cd2e1_k.jpg", "caption": "CB Radio專用無線電對講機麥克風"}}, {"start_date": {"year": "1978"}, "text": {"headline": "以誠信化危機為轉機", "text": "<strong>Pathcom</strong>公司，在一九七七年主動找上門。沒想到，出貨數月後，美律接獲Pathcom反映，品質有問題，連接CB麥克風螺旋型伸縮電纜線(cable wire)，使用沒多久就斷了，供貨給美律的大廠，即使規模是美律的好幾倍也不願負責。<br>在這種情況下，美律仍決定一肩扛起所有責任，<strong>誠實為上策</strong>。\n<p>\n他們立即告知客戶檢測結果，並承諾「一定會負責到底」。落實誠信原則，勇於認錯且負責的態度，不但化解了這場大危機，竟然還贏得客戶信賴。Pathcom後續大量增加訂貨，成為美律早期最大的客戶，奠定美律起步的基礎，雙方更維持長達十幾年密切的合作關係。"}}, {"start_date": {"year": "1978"}, "text": {"headline": "自行擬定檢測標準和程序 帶動業界仿效", "text": "一九七八年發生的CB麥克風伸縮電纜線斷線事件，凸顯台灣工業發展初期的一大問題—<strong>缺乏品管機制</strong>。\n<p>\n為了自行檢測，還研發出一套自動檢測伸縮電纜線的設備，利用機器不斷拉伸測試，搭配計數器計算拉伸次數，只要斷線即會自動警示。<br>之後，美律就自行擬定檢測標準和程序，採購的每批原材料，進貨後分批加強抽測。<br>國內伸縮電纜線業者甚至以美律設計的檢測機為原型，做出檢測機器，加入提升品質的行列。<br>這對於台灣企業建立品質管理的觀念與做法，無疑發揮了正面的影響力。"}, "media": {"url": "https://live.staticflickr.com/65535/53856649017_a93b42c6ca_c.jpg"}}, {"start_date": {"year": "1980"}, "text": {"headline": "台灣第一 <br>量產超薄型揚聲器 ", "text": "美律打造出超薄型揚聲器，是台灣第一家研發成功量產的廠商，<br>品質媲美日本水準，跟上隨身聽耳機的市場趨勢，成為美律的轉型契機。"}, "media": {"url": "https://live.staticflickr.com/65535/53799513690_8ced2dac1d_k.jpg", "caption": "超薄型揚聲器 "}}, {"start_date": {"year": "1980"}, "text": {"headline": "善用模擬軟體開發產品", "text": "一九八○年代初，美律即運用電腦資訊系統，提升經營管理效率，包括輔助設計開發產品，並有效管理產品、原材料，大幅降低成本。<br>藉由模擬軟體輔助設計，演算出最接近真實音效後，再去開模，減少研發產品失敗的風險，又可同時進行產品模擬驗證。從研發到量產，研發成本大幅降低了百分之七、八十。\n\n\n "}, "media": {"url": "https://live.staticflickr.com/65535/53851319021_e50473dbbe_h.jpg"}}, {"start_date": {"year": "1980"}, "text": {"headline": "建立讀書會<br>\n成為學習型組織實踐者", "text": "美律剛搬到模範街時，幹部才寥寥數人，就開始組織讀書會。\n那是一九八○年代初期，讀書會不定期舉行，共讀週期由一到三個月不等；每週一次、每次約兩小時，由不同幹部導讀各篇章，與共讀者分享、討論閱讀心得。"}}, {"start_date": {"year": "1981"}, "text": {"headline": "企業價值觀-<strong>「誠信」</strong> 成為品牌獨特基因", "text": "<strong>「公司只能有一套帳」</strong><br>一九八一年，曾錦堂應徵美律會計課長時，董事長廖祿立開門見山，提出他的要求。一套帳，是董事長廖祿立對股東誠信經營的不變初衷。"}, "media": {"url": "https://live.staticflickr.com/65535/53851318876_e8639facff_h.jpg", "caption": "曾錦堂副總裁"}}, {"start_date": {"year": "1982"}, "text": {"headline": "台灣第一<br>量產動圈式受話器<br>\n(Dynamic Transducer Receiver-DTR)", "text": "美律領先開發出電話機用動圈式受話器(DTR)，隔年正式量產，<br>不僅創下台灣第一家量產的紀錄，更獲得經濟部頒發「外銷加工增值獎」。\n"}, "media": {"url": "https://live.staticflickr.com/65535/53799512865_c337f2c667_k.jpg", "caption": "動圈式受話器"}}, {"start_date": {"year": "1985"}, "text": {"headline": "美律工業區總部落成", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53814440381_e43cc7553a_k.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "1986"}, "text": {"headline": "前進國際舞台", "text": "一九八六年，美律展開國際化發展藍圖，以美國做為跨出台灣的第一步。<br>美律在美國加州設立分公司，布建行銷單位，就近服務客戶。\n<br>隔年，在香港設立第二個海外分公司，當作前進東南亞和中國大陸的前哨。"}, "media": {"url": "https://live.staticflickr.com/65535/53801806295_8f49291ba8_k.jpg", "caption": "美律加州分公司"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "1989"}, "text": {"headline": "成立美律電子(深圳)有限公司", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53814435101_8b1bdbbbab_k.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "1989"}, "text": {"headline": "成立泰國廠", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53947427887_734c201a0b_c.jpg"}}, {"start_date": {"year": "1992"}, "text": {"headline": "台灣第一<br>\n量產行動電話受話器 ", "text": "美律成為台灣第一家量產行動電話受話器的廠商<br>愛立信手機就是使用美律的受話器。"}, "media": {"url": "https://live.staticflickr.com/65535/53799320568_a092274aaa_k.jpg", "caption": "行動電話受話器"}}, {"start_date": {"year": "1993"}, "text": {"headline": "榮獲第二屆「國家磐石獎」", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53835031517_2d53a56818_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "1994"}, "text": {"headline": "好的主管不只領導 <br>更是教練", "text": "一九九四年，董事長廖祿立親自擬定管理職「十訓」，把多年來的經驗，傳承給擔負管理職務的幹部，做為培養中階主管的哲學。"}, "media": {"url": "https://live.staticflickr.com/65535/53708925121_e7b29c808c_z.jpg", "caption": "美律十訓(摘錄於用心經營II)"}}, {"start_date": {"year": "1997"}, "text": {"headline": "美律的中興", "text": "管理專家沈德盛提出「STQ531」作戰計畫，正好符合美律全面革新的期望。<br>S是指Stock(庫存)，要讓庫存降為原來的百分之五十，T是Lead Time(交貨時間)，要縮短至百分之三十，Q是Quality(品質)，以將不良率降低到百分之十為目標。\n<br>這是美律成立二十二年來，首度進行的最大規模改造計畫，重新提振頹勢，全面改造美律。董事長廖祿立稱之為「美律的中興」。"}}, {"start_date": {"year": "1998"}, "text": {"headline": "股票上櫃", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53813481867_0148298ff2_k.jpg"}}, {"start_date": {"year": "1999"}, "text": {"headline": "榮獲經濟部頒發「第二屆小巨人獎」", "text": ""}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2000", "month": "7"}, "text": {"headline": "美律財務團隊", "text": "2000年股票上櫃轉上市前，PWC(資誠聯合會計師事務所)至公司進行上市前查核，財務團隊(11人)與PWC一同合影於總公司舊大樓門口。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：總管理處稽核課 鄭淑妃</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54500035696_5f9214456a_o.png"}}, {"start_date": {"year": "2000", "month": "9"}, "text": {"headline": "股票上市掛牌(代號: 2439)", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53711207274_4cfda9c1cf_c.jpg"}}, {"start_date": {"year": "2000"}, "text": {"headline": "成功研發手機用三合一功能的<br>『電話機用動圈式受話器』", "text": "副董魏文傑回憶：「我們每個月都在變更設計。」\n<br>因市場變化大需求量大增，為了因應大量的訂單，生產設備都不計成本緊急從台灣空運到泰國應急。\n<br>那一年，美律的營業額大幅成長六成。"}}, {"start_date": {"year": "2001"}, "text": {"headline": "寧可放棄商機<br>\n也不和客戶搶市場", "text": "美律因為開發出超薄型振膜的喇叭，因此吸引了不少耳機客戶，有貿易商鼓吹美律轉入耳機代工生產，但堅持不與客戶競爭的企業文化仍不為所動；<br>\n轉型的契機，來自於原是美律對講機麥克風的大客戶愛立信(Ericsson)，愛立信和奇異合資成立行動通訊公司並推出手機品牌後，需要廠商配合打造Headset(頭戴式耳機麥克風)，進而找上美律合作開發耳機。由於原先經營耳機的客戶們都已與美律無生意往來，此時美律才開始為愛立信代工，同時也陸續有機會幫法國兩大手機品牌Sagem和Alcatel代工手機用耳機。<br>\n二○○一年後，美律轉型為手機業者設計代工生產，正式聚焦耳機市場，掌握諾基亞、摩托羅拉等國際手機大廠。"}, "media": {"url": "https://live.staticflickr.com/65535/53799590755_f551628368_k.jpg", "caption": "Portable Handsfree Headset"}}, {"start_date": {"year": "2001"}, "text": {"headline": "寧靜變革 專業領導", "text": "二○○一年，董事長廖祿立以「寧靜的變革」為名，再度提出人才盤點、用人原則，將組織朝專業領導方向整合。\n<br>這次變革最主要的特點有三：1 .貫徹專業領導。 2.有效整合資源。3.協助地域性主管做行政整合，以服務客戶。<br>最難能可貴的是副董願意重披戰袍，肩負公司CTO（Chief Technology Officer）的重任。"}, "media": {"url": "https://live.staticflickr.com/65535/53835925766_4b1e035ee7_o.gif"}}, {"start_date": {"year": "2002", "month": "7"}, "text": {"headline": "輔導METC ERP上線", "text": "MEHO財務與資訊人員至METC出差，進行ERP上線。<br>\n出差同仁居住於Laem Chabang廠員工宿舍，環境優美並設置交誼廳供同仁休閒使用。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：總管理處稽核課 鄭淑妃</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54500385145_dd04517479_z.jpg"}}, {"start_date": {"year": "2002"}, "text": {"headline": "成立美特科技(蘇州)有限公司", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53821297270_7322466047_c.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2003"}, "text": {"headline": "洞見趨勢 汰弱換強的轉型", "text": "眼見手機席捲全球，董事長廖祿立決策果斷，在二○○三年結束耕耘了近三十年的CB麥克風生產線，勇敢搭上手機的潮流。就在前一年，CB麥克風營業比重仍高達百分之三十八．四，保有不錯的獲利\n<p>\nCB麥克風，即Citizen Band麥克風，是用於Citizen Band（CB）無線電通信的麥克風。CB無線電是一種短距離的業餘無線通信系統，通常用於車輛之間的通信、業餘無線愛好者的交流，或在一些商業和緊急情況下使用。"}}, {"start_date": {"year": "2004"}, "text": {"headline": "美律家風五字 以<strong>「誠」</strong>為首", "text": "二○○四年，一個歐洲客戶要求美律簽署一份品德規範合約，董事長廖祿立深受啟發。<br>美律首開風氣之先，所擬訂的<strong>「美律的商業行為與職業道德規範」手冊</strong>，上至董事會成員、高階經理人及員工，到職時都必須簽署，人手一冊，如同家風般被奉為行事圭臬"}, "media": {"url": "https://live.staticflickr.com/65535/53799514120_ca7deeb086_k.jpg", "caption": "美律商業行為與道德職業規範"}}, {"start_date": {"year": "2004"}, "text": {"headline": "用聲音傳遞<wbr>台灣動人的故事", "text": "二○○四年起，美律贊助製播<strong>「台灣幸福進行曲」</strong>節目，讓台灣各地默默耕耘的人物現身，成為節目中的主角。"}, "media": {"url": "https://live.staticflickr.com/65535/53850522667_b9877a519e_k.jpg"}}, {"start_date": {"year": "2005"}, "text": {"headline": "購併鴻鼎通訊", "text": "為爭取國際手機大廠的ODM訂單鋪路，美律在二○○五年全面購併鴻鼎通訊，擴充藍牙耳機的研發人力。"}, "media": {"url": "https://live.staticflickr.com/65535/53819941452_e3b9c9debb_h.jpg", "caption": "購併鴻鼎通訊 成立台北辦公室"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2005"}, "text": {"headline": "富比士(Forbes)雜誌評選為<br>Asia’s 200 Best Under Abillion", "text": "二○○五年榮獲「富比士」(Forbes)雜誌評選為亞太地區營收十億美元以下的最佳兩百家企業(Asia’s 200 Best Under Abillion)，\n是亞太十四個國家當中，最具成長動能、獲利表現最好的前兩百大中小企業。"}, "media": {"url": "https://live.staticflickr.com/65535/53836370335_c8fe58f9a0_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2006"}, "text": {"headline": "愛的書庫 智慧循環", "text": "<p>\n<strong>源起</strong>：臺灣921大地震後，南投災區陳一誠等老師為了讓孩子放學後留下來一起讀書，但是孩子們買不起課外書，於是找上了廖祿立董事長支持。震災重建基金會謝志誠執行長亦提供資源，與廖董事長一起推動「愛的書庫」多年。後來希望成立一個有組織的單位來持續有系統的管理，於是在2006年成立「財團法人台灣閱讀文化基金會」。\n</p>\n<p>\n<strong>現況</strong>：近20年來，在大眾的友善支持捐助下，如傳教士般在全台設置了400多所愛的書庫及數位愛的書庫，累積2萬多箱書，成立全台可以免費借書的書庫平台，提供一箱30本同樣的書供一起共讀及討論。至今已超過90%國小及53%國中學校持續使用愛的書庫資源供學生一起共讀。愛的書庫間流通，總借閱人次突破7000多萬，輔助教師教學，讓閱讀的種子灑播每一寸土地！另外讓閱讀愈有趣，每年也舉辦將近300場多元文化閱讀深耕講座，包括與作家有約…等活動，共讀為經 講座活動為輔，交織愛的書庫學習力，擴展學習視野，啟發學習潛能。\n</p>\n<p>\n<strong>願景</strong>：面對3C保母及手機滑世代，已嚴重影響孩子及青少年的身心靈人格發展，從校區共讀發展到社區、社團及企業讀書會。並透過線上數位閱讀專題探究競賽，培養線上自主學習能力，讓大人及小孩一起來提升紙本及數位閱讀雙素養能力，是基金會重要願景任務。 \n<p style=\"text-align: right;\"><a href=\"https://www.twnread.org.tw/nss/p/index\">【台灣閱讀文化基金會】</a></p>"}, "media": {"url": "https://live.staticflickr.com/65535/53857963630_000340527c.jpg"}}, {"start_date": {"year": "2007"}, "text": {"headline": "<strong>第二度獲獎</strong>-富比士(Forbes)雜誌評選為<br>Asia’s 200 Best Under Abillion", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53774947835_fc5016183a_w.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2007"}, "text": {"headline": "用實力說話 贏得客戶肯定", "text": "二○○七年，美律得到拜訪的機會，董事長廖祿立終於走進這個耳機大廠的總部大門。<br>\n做足準備、長期耕耘，以扎實的能力迎戰，兩年後，終於迎來勝出機會。<br>一年兩百多萬隻頭戴式耳機的大訂單，是客戶回饋美律的最大肯定。\n<br>至今，美律都是該客戶最信任的主力供應商，貢獻年營業額上百億元。"}}, {"start_date": {"year": "2008"}, "text": {"headline": "成立全國第一座電聲實驗室", "text": "美律捐贈設備而協助設立之國際級「美律電聲實驗室（Merry Electric AcousticLaboratory；簡稱 MEA Lab）」 2008 年於逢甲大學中科校區正式啟用，是全國第一座產學合作之電聲實驗室（含全／半無響室），亦是全國第一座符合 ISO3745、ISO7779 國際級的電聲實驗室"}, "media": {"url": "https://live.staticflickr.com/65535/53957703271_0a60579c7d_c.jpg"}}, {"start_date": {"year": "2009"}, "text": {"headline": "借助體制外的力量 進行企業改造", "text": "二○○九年開始，IBM輔導美律轉型，進行組織再造，導入新的事業單位(BU)化概念，也就是「產品事業部」的經營模式。"}}, {"start_date": {"year": "2009", "month": "1"}, "text": {"headline": "美律．光陰的日子<br>\n【勤儉立家風﹑豪傑誠正忍】\n", "text": "公司年終聚餐(現今的團圓日)，董事長室人員，重現美律草創初期，董事長與副董事長的創業艱辛。(影片部份內容純屬戲劇效果)\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：總管理處稽核課 鄭淑妃</p>"}, "media": {"url": "https://vimeo.com/1074566027?share=copy"}}, {"start_date": {"year": "2010"}, "text": {"headline": "為台灣培育電聲人才", "text": "有感於國內電聲人才和專業的不足，早在一九九五年，董事長廖祿立就推動美律和學術研究機構合作尋求解決方案。陸續與工業研究院材料所、逢甲、清華、交大、中興、大葉等二十多間大學系所和研究單位，進行計劃性產學合作；並且從二○一○年起，每年耗資百萬元舉辦「電聲論文獎」，獎勵優秀人才跨領域學習，擴大研究視野。"}, "media": {"url": "https://live.staticflickr.com/65535/53799518828_8500b5c3fe_z.jpg"}}, {"start_date": {"year": "2010"}, "text": {"headline": "成立美律電子(惠州)有限公司", "text": "2010年中國勞工意識抬頭帶動工資成本的增加，深圳廠林士傑總經理建議董事長另覓生產地讓成本結構更為優化。\n<br>恰逢曾經承包美律深圳廠工程的廠商在惠州亦有工程，詢問董事長是否有意願至惠州考察，從此即與惠州結緣。\n"}, "media": {"url": "https://live.staticflickr.com/65535/53835925246_21b215bd62_k.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2010"}, "text": {"headline": "創新研發實力 深得客戶信賴", "text": "二○一○年以來，美律研發入耳式消噪耳機、手機用防水麥克風、真無線耳機等新產品，持續寫下創新的里程碑。<br>\n美律甚至會針對有需求的客戶，提供專業的電聲教育訓練；在研發新產品時，也因聽得懂客戶的需求，和客戶容易溝通，而得到國際大廠信賴，有客戶因此縮編電聲研發部門，直接委託美律研發新技術。"}, "media": {"url": "https://live.staticflickr.com/65535/53835032252_0fff2a53f8_z.jpg"}}, {"start_date": {"year": "2011"}, "text": {"headline": "「Line」耳機<br>獲Good Design 和 IF 國際設計大獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53902899021_f83dc9fb2b_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2011"}, "text": {"headline": "收購Good Leader Enterprise Co, Ltd<br>成立美律電子(新加坡)有限公司", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53821195364_aa9ce9af38_k.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2011"}, "text": {"headline": "榮獲「2011天下企業公民獎」", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53801617213_e05692fd6d_k.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2012"}, "text": {"headline": "「revO」耳機<br>榮獲 Good Design 國際設計大獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53903152318_278547d194_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2012"}, "text": {"headline": "榮獲「2012天下企業公民獎」", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53801617213_e05692fd6d_k.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2012"}, "text": {"headline": "生活型態和互動模式改變<br>商機無限", "text": "二○一二年，美律導入模擬軟體和模擬工具，開發網路電話耳機、遊戲專屬七．一聲道環繞耳機，以及娛樂用無線頭戴式耳機，主攻遊戲機及家庭娛樂等消費型產品。"}, "media": {"url": "https://live.staticflickr.com/65535/53836177053_fe0147acc9_z.jpg"}}, {"start_date": {"year": "2012"}, "text": {"headline": "美律DNA-做志工", "text": "美律於2021年起推動『做志工、愛閱讀、懂音樂、好運動』四個DNA活動，協助同仁平衡工作與生活。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：品質保証處 陳宜鴻</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306297078_bb5976a964.jpg"}}, {"start_date": {"year": "2013"}, "text": {"headline": "榮獲天下企業公民獎中堅企業第5名", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/54443527817_b22f3823de_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2013", "month": "12"}, "text": {"headline": "榮獲經濟部工業局102年度工業精銳獎", "text": "美律首次參加經濟部工業局舉辦的第十四屆工業精銳獎，在「環境與資源」、「經營管理」與「技術」等各個項目皆有優異的表現, 獲得評審團的高度肯定, 成為「102年度工業精銳獎」得主之一。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306508500_da88b1c143_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2014"}, "text": {"headline": "Polaris and Gemma <br>獲得IF國際設計大獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53903166733_8683a21700_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2014"}, "text": {"headline": "成立泰國廠-羅永", "text": "早期台灣勞動人力不足，公司於1989年 在大陸深圳及泰國分別設立工廠，十年後，考量到泰國廠人力不足(政府未開放外勞，且當地人較多從事觀光業與農業，不喜壓力大且重覆性高的產線工作)，加上泰國供應鏈不齊全，客戶多不願意在泰國生產。\n<br>由於當時美律在上海有辦公室，也想在華東地區再成立一個工廠，於是選擇在2002年於蘇州成立美特科技，同時把泰國廠結束，移轉泰國管理團隊至蘇州；\n<br>再十年後，美國與中國關係逐漸不佳，公司為了分散風險，加上原本對泰國的熟悉，於是選擇回到泰國設廠，而選擇在羅勇設廠，主因該地區提供了稅務優惠，而泰國此時也開放外來人力(緬甸)來解決泰國人力問題，泰國工廠的營運即漸入佳境。\n"}, "media": {"url": "https://live.staticflickr.com/65535/53814653328_b860907dac_c.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2014"}, "text": {"headline": "天下公民獎大型企業組前30名", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53836437994_e4d88098b1_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2015"}, "text": {"headline": "成立美律富聆", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53967754560_3ff0fb1041_w.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2015"}, "text": {"headline": "TTQS金牌獎", "text": "勞動力發展署為提升國內各公、私立部門訓練品質，規劃「人才發展品質管理系統(簡稱TTQS)」，讓各公、私部門逐步導入，進而參與評核，藉以呈現辦理訓練品質的成效。美律在各方面均有卓越成長，榮獲金牌評比。"}, "media": {"url": "https://live.staticflickr.com/65535/54307209582_c4ea3e357f.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2016"}, "text": {"headline": "多元化的夥伴合作模式", "text": "美律和立訊集團演繹出一種新的合作模式，透過中國大陸二個工廠的合資方式，善用立訊的製造能力，擴充製造人力，共同服務大客戶，把原來做不大的市場極大化。"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2017"}, "text": {"headline": "天下企業公民獎-大型企業組", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53800440372_1791d2d393_k.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2017"}, "text": {"headline": "榮獲2017 台中市勞工局「幸福職場計畫」一星獎", "text": "美律是將員工視為家人的暖心科技業，重視員工個人及其家庭，提供貼近需求的休假福利\n與進修機制，榮獲幸福職場一星獎肯定。"}, "media": {"url": "https://live.staticflickr.com/65535/54308334318_188b2ddf7c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2017"}, "text": {"headline": "公司大廳整新", "text": "2017 年公司大廳整新，展示美律文化\"傳遞美好聲音，豐富人類生活\"意象 ，同時舉辦同仁與新Lobby 拍照活動。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：供應鏈管理總處 鄭雅婷</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54307261707_20b7646981_z.jpg"}}, {"start_date": {"year": "2018"}, "text": {"headline": "購併、合資、策略聯盟 擴大全球版圖", "text": "二○一八年，美律併購Sonavox Group旗下三間公司—— 位於中國大陸蘇州的美聲電子、加拿大的Sonavox Canada和挪威的SEAS FABRIKKER AS，以及新加坡商歐仕達聽力科技。"}, "media": {"url": "https://live.staticflickr.com/65535/53902899631_0a8d08a599_c.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2018", "month": "6"}, "text": {"headline": "明訂接班人條件 品德居首位", "text": "在創辦人及董事會三年的觀察後，務實、穩健的黃朝豐，通過接班人考核，二○一八年六月，正式接棒，成為美律第四任總裁。"}, "media": {"url": "https://live.staticflickr.com/65535/53850426147_49d366c16a.jpg"}}, {"start_date": {"year": "2018"}, "text": {"headline": "轉型成功 <br>娛樂性電聲產品<br>領導廠商", "text": "二○一八年營收攀上三百億元新高，在「天下雜誌」二○一八年兩千大企業調查中，美律以黑馬之姿，登上<strong>「營運績效五十強」</strong>的榜首。"}, "media": {"url": "https://live.staticflickr.com/65535/53704392631_b200f46bd3_c.jpg"}}, {"start_date": {"year": "2018", "month": "7"}, "text": {"headline": "運用適度調職 讓人才展翅高飛", "text": "二○一八年七月，美律技術長的位子，在副董魏文傑執掌四十幾年後，正式交棒給張瑞成。"}}, {"start_date": {"year": "2018"}, "text": {"headline": "<strong>第三度獲獎</strong>-富比士(Forbes)雜誌評選為<br>Asia’s 200 Best Under Abillion", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53835191557_1cfd0af9d8_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2019"}, "text": {"headline": "「Duo」藍芽輔聽耳機獲得IF國際設計大獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53903250759_152e819b7d.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2019"}, "text": {"headline": "首度取得台灣智慧財產權管理系統TIPS A級驗證", "text": "美律於2019年首度通過台灣智慧財產權管理制度（Taiwan Intellecual Property Management System, TIPS）A級 驗證審查，透過第三方驗證機構，確保公司在智慧財產管理之持續有效，並在驗證改善過程，建立更完整的智財防禦機制及保護創新研發的能力。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：總管理處法務專利部 楊淑瑩</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54394118628_d03b4e3042_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2020"}, "text": {"headline": "成立美律立訊(越南)有限公司", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53851754640_6c66b93554_k.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2020"}, "text": {"headline": "成立美鴻電子", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53801705269_d2fa60037b_z.jpg"}}, {"start_date": {"year": "2020"}, "text": {"headline": "TCSA台灣企業永續獎-報告書銅獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53800441327_594af6d948_k.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2020"}, "text": {"headline": "年年賺錢<br>回饋股東最大利益", "text": "二○二○年，董事長廖祿立入選「哈佛商業評論」(Harvard Business Review)「台灣CEO一百強」最佳企業執行長排名第二十二強\n總股東報酬率是百分之二千一百六十七，換言之，幫股東賺了二十一．六七倍，名列台灣最會幫股東賺錢的執行長第十二名"}, "media": {"url": "https://live.staticflickr.com/65535/53851754825_1e0f6aa12a_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2020"}, "text": {"headline": "用聲音傳遞台灣動人的故事", "text": "為了讓更多人聽見生命的美好，美律自2004 年起贊助古典音樂台製播「台灣幸福進行曲」節目，延續至今，累計報導了許多默默為台灣這塊土地與人民長期奉獻的「平凡偉人」，期望這些美好故事所展現的向上力量，能讓人見賢思齊，營造共好的公民社會。\n<br>\n二○二○年，由FM97.7台中古典音樂台製播的「台灣幸福進行曲」，敲響金鐘，獲廣播金鐘獎「單元節目獎」。\n"}, "media": {"url": "https://live.staticflickr.com/65535/53835191687_e50d27a7c8_b.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2021"}, "text": {"headline": "「Enjoin」會議揚聲器<br>榮獲GOOD DESIGN AWARD", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53903337870_15c5fa26c6.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2021"}, "text": {"headline": "加入RE100，承諾2040年達到100%可再生能源", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53800455017_ce25c7faa3_c.jpg"}}, {"start_date": {"year": "2021"}, "text": {"headline": "天下永續公民獎大型企業組前50名", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53836530340_f05de3b8a2_h.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2021"}, "text": {"headline": "TCSA台灣企業永續獎-報告書金獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53835191982_42c273bd5d_k.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2021"}, "text": {"headline": "美律榮獲第七屆公司治理評鑑排名前5%", "text": "美律於公司治理評鑑開辦以來，持續精進「維護股東權益及平等對待股東、強化董事會結構與運作、提升資訊透明度及落實企業社會責任」等四大面向，在全體員工的努力下，首度進入排名前5%企業！\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：財務總處 古岱玉</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306359699_0aabe8b429_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2021", "month": "8"}, "text": {"headline": "美律DNA-愛運動", "text": "美律健康運動從2021年至今，活動成效斐然，公司積極推動運動文化，讓員工感受到企業對員工身心健康的重視與關懷，不僅促進身體健康，讓身體內、外都漂亮，也能帶來正向的影響與改變，讓員工在忙碌之餘，也能透過運動找回活力與平衡，朝著更健康、更快樂的職場生活前進。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：電聲營運系統整合一課 朱瑩馨</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54570298551_1905e2a934_c.jpg"}}, {"start_date": {"year": "2022", "month": "5"}, "text": {"headline": "研發大樓落成", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55061399144_461f1a55d0_z.jpg"}}, {"start_date": {"year": "2022"}, "text": {"headline": "企業永續報告公開職業健康與安全指標主動評比<br>\n績優企業", "text": "為提升我國職場健康安全整體水平，本署委託財團法人安全衛生技術中心主動分析企業年度公開永續報告書，經由分析報告書中職業健康安全衛生(Occupational Safety and Health, OSH)領先指標展現狀況，可建立我國上市櫃企業OSH基線資料，同時進行主動評比，並公開表揚績優企業，以資鼓勵。"}, "media": {"url": "https://live.staticflickr.com/65535/55311290619_7d9c3f5d87_b.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2022"}, "text": {"headline": "TCSA台灣企業永續獎-報告書金獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55311311129_0f9579f24e_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2023"}, "text": {"headline": "「Aurora 」睡眠耳塞<br>榮獲 IF 國際設計大獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/53903193753_41b34938e9.jpg"}}, {"start_date": {"year": "2023", "month": "7"}, "text": {"headline": "計劃在列治文山開設總部", "text": "美律宣布計劃在列治文山開設總部，進一步貼近北美市場、深入了解客戶需求。\n<br>\n除了提升服務品質和速度，吸引當地優秀人才、強化研發創新能力，也提高集團在北美市場的影響力和品牌知名度，促進公司業務的長期發展。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306353913_c1b5377ef4_c.jpg"}}, {"start_date": {"year": "2023", "month": "12"}, "text": {"headline": "成立全台首座微聽損書庫 5400名學童受惠", "text": "美律推動微聽損倡議計畫，關注聽力保護問題，2023年成立台灣首座「聽見幸福」微聽損愛的書庫，預計一年受惠學子將近5400人，12月2日於西屯國小舉行揭牌儀式。\n<br>\n2005年成立第一座愛的書庫，至今已超過365座書庫、總借閱人數突破6863萬。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306343359_d5c545e2b1_z.jpg"}}, {"start_date": {"year": "2023"}, "text": {"headline": "榮獲健康銀齡獎", "text": "美律實業在職場積極推動中高齡(45 歲以上)員工健康保護及健康促進工作，評估中高齡員工健康需求、建立健康保護與健康促進制度，並建構友善的支持性環境等，各項作為具創意且成效卓著。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306550125_4ea0fa7bfd_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2023"}, "text": {"headline": "榮獲2023企業永續獎 企業永續報告 金獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55311302579_80d178146e_z.jpg"}}, {"start_date": {"year": "2024"}, "text": {"headline": "天下永續公民獎大型企業 永續百強", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55311231333_98c015ef9b.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "榮獲MSCI ESG Rating A級肯定", "text": "作為全球電聲產品領導品牌，美律積極推動ESG且績效顯著，除了於2023年在董事會內成立永續發展及提名委員會，強化最高治理單位對集團環境永續管理；亦在產品創新上透過核心技術為守護環境尋找解方，與供應商合作開發永續材料；更提供優於法令的制度，打造多元共榮的幸福職場，在環境、社會、治理三大面向皆正向發展，獲MSCI ESG評比獲A級肯定！"}, "media": {"url": "https://live.staticflickr.com/65535/54264401727_082d0da209_b.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "ECOVADIS銅牌獎", "text": "EcoVadis 獎項是由EcoVadis 提供的，旨在表彰在永續發展和企業社會責任（CSR）方面表現優異的企業。 EcoVadis 是一個全球性的永續性評級平台，評估企業在環境、社會和治理（ESG）方面的表現。\n<br>\n獲獎企業通常被認為在永續發展實踐上走在行業前列，能夠幫助客戶和合作夥伴提升其社會責任形象。這些獎項也為投資者和消費者提供了更清晰的永續性標準。"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "榮獲2024外資精選100強", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/54041289208_a45318a14e_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "美律榮獲第十屆公司治理評鑑排名前5%", "text": "在大環境日益變遷下，美律仍持之以恆，在全體員工的努力下，二度進入排名前5%企業！\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：財務總處 古岱玉</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306562250_94ca77ed26_b.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "SGS環境永續類金獎", "text": "SGS環境永續類獎項是由SGS（瑞士通用公證行）所主辦，旨在表彰在環境保護和可持續發展方面表現優異的企業或項目。這些獎項通常評估參賽者在環境管理、資源利用效率、碳排放減少等方面的努力和成就。\n<br>\n透過這些獎項，SGS希望鼓勵更多企業採取可持續的做法，以促進環境保護和社會責任。獲獎者通常會在業界內部和外部獲得更高的認可和聲譽。"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "CDP問卷B級", "text": "CDP問卷指的是由氣候披露專案（Carbon Disclosure Project，簡稱CDP）所設計的調查問卷，用於評估企業在氣候變化、水資源管理和森林保護等環境議題上的表現和風險管理能力。CDP是一個全球性的非營利組織，旨在促進企業和政府披露環境數據，以提高透明度和可持續性。\n<br>\n完成CDP問卷的企業可以獲得評估結果，這些結果可用來提升企業的環境治理，增加對投資者的吸引力，以及在可持續發展方面的競爭力。"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "104雇主品牌\n<br>最佳留任力獎", "text": "美律榮獲104雇主品牌大賞「最佳留任力獎」 ​ 在104人力銀行首屆雇主品牌大賞中，美律脫穎而出！ 美律視員工為最重要的合作夥伴，致力打造 安心、平等、多元發展的卓越工作環境，期許員工在友善的職場環境內，能獲得薪資與專業能力提升！\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>"}, "media": {"url": "https://live.staticflickr.com/65535/54306353914_6a993f0fde_m.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "台中市幸福職場 幸福標竿獎", "text": "台中市幸福職場幸福標竿獎是一項由台中市政府主辦的獎項，旨在表彰在職場環境、員工福祉和企業文化方面表現卓越的企業。這個獎項重點在於鼓勵企業創造一個更幸福的工作環境，提升員工的工作滿意度和生活品質。\n<br>\n獲獎的企業通常在以下幾個方面有傑出表現：\n<br>\n員工福利：提供全面的福利措施，如健康檢查、育嬰假等。\n<br>\n工作環境：創造友善和支持的工作氛圍，促進員工之間的良好互動。\n<br>\n職涯發展：重視員工的專業成長，提供培訓和進修的機會。\n<br>\n通過這個獎項，台中市希望鼓勵更多企業採取有效的措施來提升職場幸福感，進而促進整體社會的和諧發展。\n"}, "media": {"url": "https://live.staticflickr.com/65535/55061574198_e9f9cb9717_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2022"}, "text": {"headline": "勞動部工作生活平衡獎", "text": "勞動部工作生活平衡獎是由台灣勞動部主辦的一項獎項，旨在鼓勵企業推動工作與生活的平衡，以提高員工的滿意度和生活品質。該獎項評估企業在促進員工工作生活平衡方面所做的努力與成就，包括政策、措施和實踐。\n"}, "media": {"url": "https://live.staticflickr.com/65535/55311045941_6ba4e4c4c4_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "CHR健康企業公民獎 大型企業製造業組金獎", "text": "2024年共有226家企業報名，依組織規模和性質分為7組，由產、官、學者組成評審團，從企業提出的員工身心健康照顧、慢性病防治專案評選。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>"}, "media": {"url": "https://vimeo.com/1043352861?share=copy#t=0"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024", "month": "4", "day": "1"}, "text": {"headline": "第一屆M.I.創新挑戰賽", "text": "此次活動聚焦營收導向、多元發展、AI賦能與加速減碳，同仁激發無限創意，凝聚智慧，共同開啟美律創新之路的新篇章，提升營運效能，推動永續發展，開創嶄新未來。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：總管理處文管課 賴瑄憶</p>"}, "media": {"url": "https://vimeo.com/1064590210"}}, {"start_date": {"year": "2024", "month": "5"}, "text": {"headline": "中山醫大暨附設醫院攜手美律富聆簽屬MOU", "text": "中山醫大暨附設醫院攜手薩摩亞商美律富聆股份有限公司，2024/05/02 簽訂三方產學合作備忘錄，協議中美律富聆除了捐贈聽力儀器設備給學校作為教學之用，另於中山附醫院內設置駐點服務站，提供門診病患聽覺保健的一條龍服務，也提供該校語言治療與聽力學系學生實習場域。\n<br>\n美律積極實踐企業的社會責任，未來希望能創造產學合作的最大效益，即校方、院方、耳鼻喉科、病患和美律富聆等五大面向的「5 WIN」。\n<p style=\"text-align:right; font-weight:bold; margin-top:8px;\">提供者：創新設計部 陳昕緯</p>\n"}, "media": {"url": "https://live.staticflickr.com/65535/54306556505_7c68c59673_z.jpg"}}, {"start_date": {"year": "2024", "month": "11"}, "text": {"headline": "榮獲2024商業周刊「碳競爭100強」企業", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/54653617034_04d5623edd_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2024"}, "text": {"headline": "榮獲2024企業永續獎 企業永續報告 白金獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55311304924_3023668b79_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲2025企業永續獎 企業永續報告 金級", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55061353856_ccd72329df_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲TCSA人才發展領䄂獎", "text": "由財團法人台灣永續能源研究基金會主辦，旨在表彰在人才培訓、企業文化升級、數位轉型及ESG人才培育方面有卓越表現的企業。此獎肯定企業以「人」為本，將經營策略結合人才發展，建立友善職場與共榮生態，被視為台灣ESG領域的人才高榮譽"}, "media": {"url": "https://live.staticflickr.com/65535/55061709215_b4652f5a00.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲台中市政府_幸福職場\n<br>\n幸福洋溢獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55061356611_d20e505915_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲國健署績優健康職場\n<br>\n職場標竿獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55061360701_979bbcacec_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲DJSI CSA Rating產業前10%", "text": "DJSI CSA Rating（道瓊永續指數企業永續評鑑）是全球公認最具公信力的ESG（環境、社會、公司治理）評級之一。它透過標普全球（S&P Global）的問卷調查，評估企業在環境、社會與經濟面向的永續績效。高分企業會被納入DJSI指數，是投資人衡量企業長期投資價值與永續經營能力的重要參考。"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲EcoVADIS全球供應鏈評鑑 銀級", "text": "EcoVadis是一個總部位於法國的全球性企業供應鏈永續評鑑平台。該平台旨在協助企業評估其供應鏈的社會和環境責任績效，並且透過評分等地提供相對應可改進建議。其中，EcoVadis的背後方法學根據企業社會責任標準ISO 26000 為基礎，再輔以ESG永續報告重要準則規範GRI與聯合國全球盟約的主要精神，鎖定「環境管理、商業道德、勞工人權、永續供應鏈建置」等面向作為評估重點。"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "CDP碳揭露專案氣侯變遷問卷 A級", "text": "CDP問卷指的是由氣候披露專案（Carbon Disclosure Project，簡稱CDP）所設計的調查問卷，用於評估企業在氣候變化、水資源管理和森林保護等環境議題上的表現和風險管理能力。CDP是一個全球性的非營利組織，旨在促進企業和政府披露環境數據，以提高透明度和可持續性。"}, "media": {"url": "https://live.staticflickr.com/65535/55061380011_b383287347_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "外資精選百強", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55061382471_d99f2c3fbb_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025"}, "text": {"headline": "榮獲第十一屆公司治理評鑑排名前20%", "text": ""}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "2"}, "text": {"headline": "美律首度獲選標普全球<br>2025年永續年鑑", "text": "S&P Global為全球最具公信力的指數及評等機構之一，每年透過企業永續評比（Corporate Sustainability Assessment, CSA）對全球上市公司在環境、社會及治理（包括經濟）領域永續表現進行評分。2025年度共有7,690家全球企業參與評估，並根據其永續表現評分，僅選出產業排名前15%的企業收錄於永續年鑒（Sustainability Yearbook）。\n<br>美律實業（Merry Electronics）榮獲全球權威永續評比機構標普全球（S&P Global）2025年永續年鑑（Yearbook）認證，成為業界矚目的永續領航者，在此之前，美律亦獲得MSCI ESG評比 A級評價。種種成就，證明美律在推動永續上的持續努力與卓越成果。"}, "media": {"url": "https://live.staticflickr.com/65535/54337490990_b86fd04f6c_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "2"}, "text": {"headline": "美律通過SBTi科學減碳目標認證<br>承諾2032年大幅減碳", "text": "美律實業宣布，已正式通過科學基礎減碳目標倡議（Science Based Targets initiative, SBTi）對短期(near-term)減碳目標的認證，此舉展現了美律對於永續經營的堅定信念，並正式承諾到2032年，將範圍1和範圍2溫室氣體絕對排放量從2023年的基準年減少50.4%；範圍3溫室氣體絕對排放量減少30%。"}, "media": {"url": "https://live.staticflickr.com/65535/54379586053_7c6bb49bd4_c.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "3"}, "text": {"headline": "併購MWT Holdings Co.,Ltd.<br>成立TEBU", "text": "收購 MWT Holdings 及其旗下公司（包含東京音響與 Tokumi Electronics）100%股權，擴大東北亞市場滲透力，直接取得日本知名耳機品牌客戶，並整合泰國等地的生產製造資源。"}}, {"start_date": {"year": "2025", "month": "7"}, "text": {"headline": "榮獲MSCI ESG Rating A級肯定", "text": "2025年再次獲得MSCI ESG A級評比"}, "media": {"url": "https://live.staticflickr.com/65535/54264401727_082d0da209_b.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "9"}, "text": {"headline": "美律宣告將RE100時程提前至2030年", "text": "美律決定主動引領產業綠色轉型。提前十年達成RE100目標，是對地球環境的責任，更是對未來世代的承諾。」\n<br>\n為達成目標，公司將透過簽署長期購電協議採購綠色電力、在廠區建置太陽能發電系統、導入節能設備提升能源效率等策略。同時將要求供應商制定碳中和時程，共同建構綠色供應鏈。\n"}, "media": {"url": "https://live.staticflickr.com/65535/54887775525_2f71f3bce4_z.jpg"}}, {"start_date": {"year": "2025", "month": "10"}, "text": {"headline": "榮獲天下永續公民獎大型製造業組第16名", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/54888501937_e77a4a8efc_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "10"}, "text": {"headline": "榮獲親子天下友善家庭職場獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/54889619644_ea44bc984e_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "10"}, "text": {"headline": "榮獲天下人才永續獎", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/54889619659_54acfe896a_z.jpg"}, "background": {"color": "#FFE4B5"}}, {"start_date": {"year": "2025", "month": "10"}, "text": {"headline": "泰國龍炎廠(METC2)投產", "text": ""}, "media": {"url": "https://live.staticflickr.com/65535/55061748869_51f700c85d_c.jpg"}, "background": {"color": "#00CED1"}}, {"start_date": {"year": "2026", "month": "1"}, "text": {"headline": "美律新LOGO", "text": "呼應美律從聲學結合視覺到多感知的發展，從即有基礎上，創造出不同面向的極大可能。\n<br>\n以美律的M為基礎，可以代表「聲學」、「視覺」、「多感知」，可以代表「想像與創造」、「系統化實踐」、「正向影響力」，在未來創造新現實與帶來永續美好的生活目標。\n<br>\n創造不同視角所能賦予最大的能量，從不同的角度去看到不同的價值、願景、理想，也能以不同切角去衍伸出最大的可能性。激勵他人、提升自我、目標設定、熱情和創意，龐大的能量將會成為最主要的推手，不去預想能從甚麼方面賦予多少，而是不保留的全方位提供最大值的可能。"}, "media": {"url": "https://live.staticflickr.com/65535/55061149791_51bfc76b88.jpg"}}, {"start_date": {"year": "2026", "month": "5", "day": "26"}, "text": {"headline": "董事長交接", "text": "創辦人廖祿立、共同創辦人魏文傑卸任行政職務，將以董事身份持續留任董事會，貢獻治理經驗。\n<br>\n董事會決議推選廖耕彬出任新任董事長，在美律50年的技術底蘊與客戶信任基礎上，持續為股東、客戶與社會創造長遠價值，打造聲學感知領域的多元可能性。"}, "media": {"url": "https://live.staticflickr.com/65535/55309108761_e310a3a359_z.jpg"}}]};
